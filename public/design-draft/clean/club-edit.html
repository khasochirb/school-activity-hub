<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Edit club page · Clean draft</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="../common.css">
<link rel="stylesheet" href="clean.css">
<link rel="stylesheet" href="extra-a.css">
<link rel="stylesheet" href="extra-b.css">
<link rel="stylesheet" href="extra-c.css">
<style></style>
</head>
<body>
<div id="app"></div>
<script src="../app.js"></script>
<script src="../luma/site.js"></script>
<script src="clean.js"></script>
<script>
(function () {
const S = window.Site, C = window.Clean, { esc } = S;
// TITLE: Edit club page
// Edit club page (leader or staff): appearance, page text and theme as tabs inside one form, a live preview of the
// club card beside it, and one "Save changes" button in a sticky bar that says when something is unsaved.
const I = (p) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${p}</svg>`;
const IC = { image: I('<rect x="3.5" y="4.5" width="17" height="15" rx="3"/><circle cx="9" cy="10" r="2"/><path d="M20.5 16l-5-5-8 8.5"/>'), warn: I('<path d="M12 4l9 16H3z"/><path d="M12 10v4M12 17h.01"/>'), info: I('<circle cx="12" cy="12" r="8.5"/><path d="M12 11v5M12 8h.01"/>') };
const THEMES = { forest: ["Soft green", "#1f8a5b"], sky: ["Calm blue", "#2f6fd6"], warm: ["Warm amber", "#c27a12"], plum: ["Muted plum", "#8a5a9a"] };
const LIMITS = { tagline: 120, about: 1200, schedule: 240, location: 240, who: 400, participation: 400, accessibility: 400, cost: 160, materials: 300 };
const LABELS = { tagline: "Short tagline", about: "About this club", schedule: "Meeting schedule", location: "Meeting location", who: "Who can join", participation: "Participation and commitment", accessibility: "Accessibility", cost: "Cost", materials: "Materials" };
const LONG = ["about", "who", "participation", "accessibility", "materials"];
const DEF_THEME = { robotics: "sky", debate: "warm", morin: "warm", basketball: "forest", volunteers: "plum" };
const IMG = { logo: { max: 2, min: [256, 256], ratio: 1, label: "Club logo", spec: "Square, at least 256×256, up to 2 MB" }, banner: { max: 5, min: [1200, 400], ratio: 3, label: "Club banner", spec: "3:1, at least 1200×400, up to 5 MB" } };
const key = () => (S.CLUBS[location.hash.slice(1)] ? location.hash.slice(1) : "robotics");
const pages = () => S.list("clubPages", [{}])[0];
const base = (k) => { const c = S.CLUBS[k]; return { tagline: k === "robotics" ? "Build it, break it, race it." : "", about: c.about, schedule: c.meets, location: c.where, who: "Any student in grades 9–12. No experience needed.", participation: "Come when you can. Members who join a competition team commit to both weekly sessions.", accessibility: k === "basketball" ? "" : "Ground-floor room with step-free access.", cost: "Free", materials: k === "robotics" ? "Kits and laptops are provided. Bring a notebook." : "", beginners: ["robotics", "volunteers", "morin"].includes(k), firstFree: k !== "basketball", theme: DEF_THEME[k] || "sky", logo: "", banner: "" }; };
const saved = (k) => Object.assign(base(k), pages()[k] || {});
let tab = "appearance", d = null, warn = {}, lastKey = null;
const canEdit = (k) => C.staff() || (C.role() === "student" && k === "robotics");
const dirty = () => JSON.stringify(d) !== JSON.stringify(saved(key()));

function imgRow(which) {
  const m = IMG[which], src = d[which], c = S.CLUBS[key()];
  const pv = src ? `<img src="${src}" alt="">` : which === "logo" ? `<span class="clubav" style="width:100%;height:100%;border-radius:0;font-size:26px;background:${THEMES[d.theme][1]}">${c.short}</span>` : S.art(c.art);
  return `<div class="cle-img" ${which === "banner" ? 'style="grid-template-columns:120px minmax(0,1fr)"' : ""}><span class="pv ${which === "banner" ? "wide" : ""}" ${which === "banner" ? 'style="width:120px"' : ""}>${pv}</span>
    <div style="min-width:0"><b>${m.label}</b><span class="s">${m.spec}</span><div class="acts"><label class="btn btn-soft btn-sm">${IC.image}${src ? "Replace image" : "Upload image"}<input type="file" accept="image/png,image/jpeg,image/webp" data-up="${which}" aria-label="${src ? "Replace" : "Upload"} ${m.label.toLowerCase()}"></label>${src ? `<button type="button" class="btn btn-sm" data-rm="${which}">Remove image</button>` : ""}</div></div>
    ${warn[which] ? `<div class="b-note ${warn[which][0]}">${warn[which][0] === "bad" ? IC.warn : IC.info}<div>${esc(warn[which][1])}</div></div>` : ""}</div>`;
}
function field(n) {
  const v = d[n] || "", left = LIMITS[n] - v.length;
  const ctl = LONG.includes(n) ? `<textarea class="textarea" name="${n}" rows="${n === "about" ? 6 : 3}" maxlength="${LIMITS[n]}">${esc(v)}</textarea>` : `<input class="input" name="${n}" value="${esc(v)}" maxlength="${LIMITS[n]}">`;
  return `<label class="field"><span>${LABELS[n]}</span>${ctl}<small class="b-cnt ${left < 20 ? "low" : ""}" data-cnt="${n}">${left} characters remaining</small></label>`;
}
function preview() {
  const k = key(), c = S.CLUBS[k], col = THEMES[d.theme][1];
  return `<article class="card club cle-prev" style="--club:${col};--club-ink:color-mix(in srgb, ${col} 72%, var(--fg))"><span class="strip"></span>
    <span class="banner">${d.banner ? `<img src="${d.banner}" alt="">` : S.art(c.art)}<span class="clubav">${d.logo ? `<img src="${d.logo}" alt="">` : c.short}</span></span>
    <div class="body"><div style="display:flex;justify-content:space-between;gap:8px;align-items:center"><span class="t">${esc(c.name)}</span>${C.cat(c.category)}</div>
      ${d.tagline ? `<span class="tl">${esc(d.tagline)}</span>` : ""}
      <p class="muted" style="font-size:13.5px">${esc((d.about || "More club information will be added soon.").slice(0, 110))}${(d.about || "").length > 110 ? "…" : ""}</p>
      ${d.beginners || d.firstFree ? `<span class="newc">${d.beginners ? "<span>Beginners welcome</span>" : ""}${d.firstFree ? "<span>First visit free</span>" : ""}</span>` : ""}
      <span class="nextm">Meets <b>${esc(d.schedule || "—")}</b>${d.location ? ` · ${esc(d.location)}` : ""}</span>
      <div class="meta"><span style="display:flex;align-items:center;gap:8px">${S.avatars(c.members, 4)}${c.members} members</span><span>${esc(d.cost || "")}</span></div></div></article>`;
}
function sideHTML() {
  const keys = Object.keys(LIMITS), filled = keys.filter((n) => (d[n] || "").trim()).length + (d.logo ? 1 : 0) + (d.banner ? 1 : 0), total = keys.length + 2;
  const empty = [...keys.filter((n) => !(d[n] || "").trim()).map((n) => LABELS[n]), ...(d.logo ? [] : ["Club logo"]), ...(d.banner ? [] : ["Club banner"])];
  return `<div class="b-sticky"><div class="card widget"><h3>Live preview</h3>${preview()}<span class="muted" style="font-size:12.5px">How the club looks on Clubs and the club sheet.</span></div>
    <div class="card widget"><h3>Page completeness</h3><div class="goal"><div><span>${filled === total ? "Everything filled in" : `${total - filled} still empty`}</span><b>${filled}/${total}</b></div><div class="bar" style="--c:${filled === total ? "var(--green)" : "var(--sun)"}"><i style="width:${(filled / total) * 100}%"></i></div></div>
      ${empty.length ? `<p class="muted" style="font-size:13px">Empty: ${empty.slice(0, 4).map(esc).join(", ")}${empty.length > 4 ? ` and ${empty.length - 4} more` : ""}. Empty sections are hidden on the club page.</p>` : ""}</div></div>`;
}
function render() {
  const k = key(), c = S.CLUBS[k];
  if (!canEdit(k)) { C.shell("clubs", `<a class="b-back" href="club.html#${k}">← Back to club page</a><div class="card empty"><b style="color:var(--fg)">Only club leaders and staff can edit this club page</b><br>${C.role() === "student" ? "You lead Robotics Club, so you can edit that one." : ""}</div>`); S.startClock(); return; }
  if (!d || lastKey !== k) { d = saved(k); warn = {}; lastKey = k; }
  const TABS = [["appearance", "Appearance"], ["text", "Page text"], ["theme", "New students and theme"]];
  C.shell(C.staff() ? "" : "clubs", `
    <a class="b-back" href="club.html#${k}">← Back to club page</a>
    <div class="head b-head"><div style="display:flex;gap:14px;align-items:center">${S.clubAv(k, 56)}<div><h1>Edit club page</h1><p>${esc(c.name)} · ${C.staff() ? "you're editing as staff" : "you're the club leader"}</p></div></div>
      ${C.menu([{ label: "View club page", href: `club.html#${k}` }, { label: "Print club sheet", href: "print-clubs.html" }, "-", { label: "Discard changes", act: "discard", danger: true }])}</div>
    <div class="split">
      <form id="clef" style="display:flex;flex-direction:column;gap:20px;min-width:0" novalidate>
        <div class="ptabs" role="tablist">${TABS.map(([t, l]) => `<button type="button" role="tab" data-tab="${t}" aria-selected="${tab === t}">${l}</button>`).join("")}</div>
        <div class="cle-tabpanel" data-panel="appearance" ${tab === "appearance" ? "" : "hidden"}>
          <section class="card b-card sec"><header><div><h2>Club appearance</h2><p>The banner and logo show on the club page, the club card and the printed sheet.</p></div></header>
            <div class="cle-banner" id="clebig" style="--club:${THEMES[d.theme][1]}">${d.banner ? `<img src="${d.banner}" alt="Club banner">` : S.art(c.art)}<span class="logo">${d.logo ? `<img src="${d.logo}" alt="Club logo">` : c.short}</span></div>
            ${imgRow("banner")}${imgRow("logo")}
            <div class="b-note">${IC.info}<div><b>Only use images you have the right to use</b><p>Your own photos or drawings, or ones the club made. No photos where students can be recognised unless they agreed.</p></div></div>
          </section></div>
        <div class="cle-tabpanel" data-panel="text" ${tab === "text" ? "" : "hidden"}>
          <section class="card b-card sec"><header><div><h2>About the club</h2><p>Short and friendly. Empty sections are hidden.</p></div></header>${field("tagline")}${field("about")}</section>
          <section class="card b-card sec" style="margin-top:20px"><header><div><h2>Meetings</h2></div></header><div class="b-grid2">${field("schedule")}${field("location")}</div></section>
          <section class="card b-card sec" style="margin-top:20px"><header><div><h2>Joining</h2></div></header>${field("who")}${field("participation")}${field("accessibility")}</section>
          <section class="card b-card sec" style="margin-top:20px"><header><div><h2>Cost and materials</h2></div></header>${field("cost")}${field("materials")}</section></div>
        <div class="cle-tabpanel" data-panel="theme" ${tab === "theme" ? "" : "hidden"}>
          <section class="card b-card sec"><header><div><h2>For new students</h2><p>Shown as badges on the club card.</p></div></header>
            <label class="b-check"><input type="checkbox" name="beginners" ${d.beginners ? "checked" : ""}><span>Beginners welcome<small>No experience needed to join.</small></span></label>
            <label class="b-check"><input type="checkbox" name="firstFree" ${d.firstFree ? "checked" : ""}><span>First visit free<small>Students can try one meeting before joining.</small></span></label></section>
          <section class="card b-card sec" style="margin-top:20px"><header><div><h2>Club page theme</h2><p>A subtle colour for the club page. Text stays readable in light and dark.</p></div></header>
            <div class="cle-themes" role="radiogroup" aria-label="Club page theme">${Object.entries(THEMES).map(([tk, [l, col]]) => `<label><input type="radio" name="theme" value="${tk}" ${d.theme === tk ? "checked" : ""}><span class="sw" style="background:color-mix(in srgb, ${col} 14%, var(--card))"><i style="width:45%;background:${col}"></i><i style="width:75%;background:color-mix(in srgb, ${col} 40%, var(--card))"></i></span>${l}</label>`).join("")}</div></section></div>
        <div class="cle-bar"><span id="cledirty">${dirty() ? '<span class="dirty">Unsaved changes</span>' : "All changes saved"}</span><button class="btn btn-primary">Save changes</button></div>
      </form>
      <aside class="side" id="cleside">${sideHTML()}</aside>
    </div>`);
  S.startClock();
}
function sync() {
  const f = document.getElementById("clef"); if (!f) return;
  Object.keys(LIMITS).forEach((n) => { const el = f.querySelector(`[name="${n}"]`); if (el) d[n] = el.value.slice(0, LIMITS[n]); });
  d.beginners = f.querySelector('[name="beginners"]').checked; d.firstFree = f.querySelector('[name="firstFree"]').checked;
  const t = f.querySelector('[name="theme"]:checked'); if (t) d.theme = t.value;
}
function live() {
  document.querySelectorAll("[data-cnt]").forEach((el) => { const left = LIMITS[el.dataset.cnt] - (d[el.dataset.cnt] || "").length; el.textContent = `${left} characters remaining`; el.classList.toggle("low", left < 20); });
  document.getElementById("cleside").innerHTML = sideHTML();
  document.getElementById("cledirty").innerHTML = dirty() ? '<span class="dirty">Unsaved changes</span>' : "All changes saved";
  const big = document.getElementById("clebig"); if (big) big.style.setProperty("--club", THEMES[d.theme][1]);
}
function upload(which, file) {
  const m = IMG[which];
  if (!/^image\/(png|jpe?g|webp)$/.test(file.type)) { warn[which] = ["bad", "Use a JPG, PNG or WebP image."]; render(); return; }
  if (file.size > m.max * 1024 * 1024) { warn[which] = ["bad", `This file is ${(file.size / 1048576).toFixed(1)} MB. The ${m.label.toLowerCase()} can be up to ${m.max} MB.`]; render(); return; }
  const r = new FileReader();
  r.onload = () => { const img = new Image(); img.onload = () => {
    const w = img.width, h = img.height, ratio = w / h, notes = [];
    if (w < m.min[0] || h < m.min[1]) notes.push(`It's ${w}×${h}, smaller than ${m.min[0]}×${m.min[1]}, so it may look blurry.`);
    if (Math.abs(ratio - m.ratio) / m.ratio > 0.08) notes.push(which === "logo" ? `It isn't square (${w}×${h}), so the edges will be cropped.` : `It's ${w}×${h} (about ${ratio.toFixed(1)}:1). Banners are 3:1, so the ${ratio < 3 ? "top and bottom" : "sides"} will be cropped.`);
    warn[which] = notes.length ? ["warn", notes.join(" ")] : ["ok", `Looks good: ${w}×${h}.`];
    const max = which === "logo" ? 320 : 1500, k = Math.min(1, max / Math.max(w, h)), cv = document.createElement("canvas"); cv.width = Math.round(w * k); cv.height = Math.round(h * k);
    cv.getContext("2d").drawImage(img, 0, 0, cv.width, cv.height); d[which] = cv.toDataURL("image/jpeg", 0.85); render(); S.toast(`${m.label} added. Save to publish it.`); };
    img.onerror = () => { warn[which] = ["bad", "That file couldn't be read as an image."]; render(); }; img.src = r.result; };
  r.readAsDataURL(file);
}
document.addEventListener("input", (e) => { if (e.target.closest("#clef") && e.target.type !== "file") { sync(); live(); } });
document.addEventListener("change", (e) => { const up = e.target.closest("[data-up]"); if (up && up.files[0]) { sync(); upload(up.dataset.up, up.files[0]); return; } if (e.target.closest("#clef")) { sync(); live(); } });
document.addEventListener("submit", (e) => {
  if (e.target.id !== "clef") return; e.preventDefault(); sync();
  pages()[key()] = JSON.parse(JSON.stringify(d)); S.saveLists(); render(); S.toast("Club page saved.");
});
document.addEventListener("click", (e) => {
  const t = e.target.closest("[data-tab]"); if (t) { sync(); tab = t.dataset.tab; document.querySelectorAll("#clef [data-tab]").forEach((b) => b.setAttribute("aria-selected", String(b === t))); document.querySelectorAll("[data-panel]").forEach((p) => (p.hidden = p.dataset.panel !== tab)); }
  const rm = e.target.closest("[data-rm]"); if (rm) { sync(); d[rm.dataset.rm] = ""; delete warn[rm.dataset.rm]; render(); }
  if (e.target.closest('[data-act="discard"]')) S.confirm("Discard changes?", "Your edits since the last save will be lost.", "Discard", () => { d = saved(key()); warn = {}; render(); });
});
window.addEventListener("hashchange", () => { d = null; render(); });
render();

})();
</script>
</body>
</html>
