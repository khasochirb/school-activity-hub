<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Club sheet · Clean draft</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="../common.css">
<link rel="stylesheet" href="clean.css">
<link rel="stylesheet" href="extra-a.css">
<link rel="stylesheet" href="extra-b.css">
<link rel="stylesheet" href="extra-c.css">
<style></style>
</head>
<body>
<div id="app"></div>
<script src="../app.js"></script>
<script src="../luma/site.js"></script>
<script src="clean.js"></script>
<script src="parent-data.js"></script>
<script>
(function () {
const S = window.Site, C = window.Clean, { esc } = S;
// TITLE: Club sheet
// Print club sheet: a standalone page (no app shell) that prints as one clean A4 sheet for the noticeboard.
// One button: Print. Clubs can be left off with the chips above the sheet; those never print.
const I = (p) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${p}</svg>`;
const PRINT = I('<path d="M7 9V4h10v5"/><rect x="3.5" y="9" width="17" height="8" rx="2"/><path d="M7 14h10v6H7z"/>');
const pages = () => (S.list("clubPages", [{}])[0] || {});
const off = new Set();
function render() {
  const all = Object.entries(S.CLUBS), shown = all.filter(([k]) => !off.has(k)), pg = pages();
  const printed = C.NOW.toLocaleDateString("en-US", { month: "short", day: "numeric", year: "numeric" });
  document.documentElement.style.removeProperty("--tint");
  document.getElementById("app").innerHTML = `
    <div class="wrap">
      <div class="pc-top"><a class="b-back" href="clubs.html">← Clubs</a><div class="pc-tools">${C.menu([{ label: "Copy link to this sheet", act: "copy" }, { label: "Open clubs page", href: "clubs.html" }, "-", { label: "Light / dark", act: "theme" }])}<button class="btn btn-primary" data-print>${PRINT} Print</button></div></div>
      <div class="pc-incl" role="group" aria-label="Clubs on the sheet"><span>On the sheet:</span>${all.map(([k, c]) => `<button class="chip" data-c style="--c:${c.color}" data-toggle="${k}" aria-pressed="${!off.has(k)}">${esc(c.name)}</button>`).join("")}</div>
      <article class="pc-sheet">
        <header class="pc-mast"><div><small>Clubs at your school</small><h1>Club list · ${esc(S.SCHOOL.name)}</h1><p>Try something new this term. Every club welcomes visitors.</p></div>
          <span class="pc-brand"><i><svg width="14" height="14" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="10" r="5" fill="#ffc23d"/><path d="M2.5 20.5c2.6-4.2 5.9-6.3 9.5-6.3s6.9 2.1 9.5 6.3" stroke="#fff" stroke-linecap="round" stroke-width="3"/></svg></i>Activity Hub</span></header>
        ${shown.length ? `<div class="pc-list">${shown.map(([k, c]) => { const p = pg[k] || {}; const beg = p.beginners ?? ["robotics", "volunteers", "morin"].includes(k), free = p.firstFree ?? k !== "basketball";
          return `<section class="pc-club">${p.logo ? `<span class="clubav" style="background:${c.color};overflow:hidden"><img src="${p.logo}" alt="" style="width:100%;height:100%;object-fit:cover"></span>` : S.clubAv(k)}<div style="min-width:0"><h2>${esc(c.name)} <em style="--c:${c.color}">${esc(c.category)}</em></h2><p>${esc(p.tagline || c.about)}</p>
            <dl><dt>Meets</dt><dd>${esc(p.schedule || c.meets)}</dd><dt>Where</dt><dd>${esc(p.location || c.where)}</dd><dt>Advisor</dt><dd>${esc(c.advisor)}</dd><dt>Members</dt><dd>${c.members}</dd><dt>Cost</dt><dd>${esc(p.cost || "Free")}</dd></dl>
            ${beg || free ? `<div class="chips">${beg ? "<span>Beginners welcome</span>" : ""}${free ? "<span>First visit free</span>" : ""}</div>` : ""}</div></section>`; }).join("")}</div>`
          : '<p style="padding:30px 0;text-align:center;color:#737577">No active clubs are registered here yet.</p>'}
        <div class="pc-qr"><span class="q">${S.qr("clubs-" + S.SCHOOL.slug, 25)}</span><div><b>Scan the QR code to see every club and sign up.</b><p>Sign in with your student account, open a club and press Join. New here? Ask your class teacher for an invite code.</p><code>activityhub.mn/${esc(S.SCHOOL.slug)}/clubs</code></div></div>
        <footer class="pc-foot"><span>${shown.length} clubs · Printed: ${printed}</span><span>${esc(S.SCHOOL.name)} · Activity Hub</span></footer>
      </article>
    </div>
    <div class="draftnote"><span>Clean draft</span><a href="index.html">All screens</a></div>`;
}
document.addEventListener("click", (e) => {
  if (e.target.closest("[data-print]")) window.print();
  const t = e.target.closest("[data-toggle]"); if (t) { const k = t.dataset.toggle; off.has(k) ? off.delete(k) : off.add(k); render(); }
  if (e.target.closest('[data-act="copy"]')) S.toast("Link copied.");
});
render();

})();
</script>
</body>
</html>
