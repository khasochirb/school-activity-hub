<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Safeguarding inbox · Clean draft</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="../common.css">
<link rel="stylesheet" href="clean.css">
<link rel="stylesheet" href="extra-a.css">
<link rel="stylesheet" href="extra-b.css">
<link rel="stylesheet" href="extra-c.css">
<style></style>
</head>
<body>
<div id="app"></div>
<script src="../app.js"></script>
<script src="../luma/site.js"></script>
<script src="clean.js"></script>
<script src="parent-data.js"></script>
<script>
(function () {
const S = window.Site, C = window.Clean, { esc } = S;
// TITLE: Safeguarding inbox
// Safeguarding inbox (designated staff): an inbox like Approvals. Pick a report on the left; on the right the facts,
// the confidential description behind a reveal, and one action: move it to the next workflow status.
const I = (p) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${p}</svg>`;
const IC = { lock: I('<rect x="5" y="10.5" width="14" height="10" rx="2.5"/><path d="M8.5 10.5V8a3.5 3.5 0 0 1 7 0v2.5"/>'), eye: I('<path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12z"/><circle cx="12" cy="12" r="3"/>'), shield: I('<path d="M12 3.5l7.5 3v5.5c0 4.5-3.2 7.8-7.5 9-4.3-1.2-7.5-4.5-7.5-9V6.5z"/>'), talk: I('<path d="M4 5.5h16v10H9l-5 4z"/>'), user: I('<circle cx="12" cy="8" r="4"/><path d="M4.5 20.5c1.2-4 4-6 7.5-6s6.3 2 7.5 6"/>'), bolt: I('<path d="M13 3L5 13.5h6L10 21l8-10.5h-6z"/>'), web: I('<rect x="3.5" y="4.5" width="17" height="13" rx="2.5"/><path d="M8 21h8M12 17.5V21"/>'), dot: I('<circle cx="12" cy="12" r="8"/><path d="M12 8v5M12 16h.01"/>'), out: I('<path d="M14 4.5h5.5V10M19.5 4.5L11 13"/><path d="M18 14v4.5a1.5 1.5 0 0 1-1.5 1.5h-11A1.5 1.5 0 0 1 4 18.5v-11A1.5 1.5 0 0 1 5.5 6H10"/>') };
const CAT = { "Bullying or harassment": ["#e0447a", IC.talk], "Personal safety": ["#f2643f", IC.user], "Activity or event concern": ["#2340d9", IC.bolt], "Online or platform safety": ["#6b4fd6", IC.web], "Other safety concern": ["#6d6a63", IC.dot] };
const FLOW = ["Submitted", "Being reviewed", "Closed"];
const reports = () => S.list("safety", S.SAFETY_REPORTS);
const today = () => C.NOW.toISOString().slice(0, 10);
let f = "open", q = "", sel = null; const seen = {};
const statusTag = (s) => `<span class="tag ${s === "Closed" ? "ok" : s === "Being reviewed" ? "blue" : "warn"}">${s}</span>`;

function render() {
  if (!["teacher", "admin"].includes(C.role())) { C.shell("", `<a class="b-back" href="safety.html">← Safety and support</a><div class="card empty"><b style="color:var(--fg)">This inbox is restricted</b><br>Only the school's safety response team can open safety reports. To report a concern, use Safety and support.</div>`); S.startClock(); return; }
  const all = reports();
  const items = all.filter((r) => (f === "all" || (f === "open" ? r.status !== "Closed" : r.status === f)) && (!q || (r.category + r.reporter + r.related).toLowerCase().includes(q.toLowerCase())))
    .sort((a, b) => FLOW.indexOf(a.status) - FLOW.indexOf(b.status) || b.submitted.localeCompare(a.submitted));
  const cur = items.find((r) => r.id === sel) || items[0];
  const count = (s) => all.filter((r) => r.status === s).length;
  const next = cur ? FLOW.slice(FLOW.indexOf(cur.status) + 1) : [];
  C.shell("", `
    <a class="b-back" href="safety.html">← Safety and support</a>
    <div class="head b-head"><div><h1>Safeguarding inbox</h1><p>${all.filter((r) => r.status !== "Closed").length} open · restricted to the safety response team</p></div>${C.menu([{ label: "Safety response team", href: C.role() === "admin" ? "safety-team.html" : "safety.html", hint: C.role() === "admin" ? "Add or remove responders" : "Ask your school admin to change it" }, { label: "Report a concern yourself", href: "safety.html#report" }])}</div>
    <div class="b-note bad">${IC.lock}<div><b>Highly confidential information</b><p>Only designated responders can see this page. Don't copy, screenshot or discuss reports outside the response process. Every status change is recorded.</p></div></div>
    <div class="statline"><span><b>${count("Submitted")}</b>new</span><span><b>${count("Being reviewed")}</b>being reviewed</span><span><b>${count("Closed")}</b>closed</span><span><b>${all.filter((r) => r.contact && r.status !== "Closed").length}</b>want to be contacted</span></div>
    <div class="filters">${[["open", "Open"], ["Submitted", "Submitted"], ["Being reviewed", "Being reviewed"], ["Closed", "Closed"], ["all", "All"]].map(([k, l]) => `<button class="chip" data-f="${k}" aria-pressed="${f === k}">${l}</button>`).join("")}<label class="search">${C.ICON.search}<span class="sr">Search reports</span><input id="q" type="search" placeholder="Category, reporter or activity" value="${esc(q)}"></label></div>
    ${cur ? `<div class="inbox">
      <div class="card rows">${items.map((r) => `<button class="row click si-row ${r === cur ? "sel" : ""}" data-sel="${r.id}" style="border:0;background:none;width:100%;text-align:left;font:inherit;cursor:pointer;color:inherit"><span class="grow"><span class="t" style="--c:${CAT[r.category][0]}"><i></i>${esc(r.category)}</span><span class="s">${esc(r.reporter || "Reporter name unavailable")} · ${S.fmtDate(r.submitted)}</span><span class="flags">${statusTag(r.status)}${r.contact ? '<span class="tag">Contact requested</span>' : ""}</span></span></button>`).join("")}</div>
      <article class="card b-card" style="padding:22px">
        <div class="si-head"><span class="b-tile" style="--c:${CAT[cur.category][0]};width:52px;height:52px;border-radius:16px">${CAT[cur.category][1]}</span><div style="min-width:0"><h2>${esc(cur.category)}</h2><p class="muted" style="font-size:13.5px;margin-top:2px">Report ${esc(cur.id.toUpperCase())} · submitted ${S.fmtDate(cur.submitted)}</p></div><span style="margin-left:auto;display:flex;gap:4px;align-items:center">${statusTag(cur.status)}${C.menu([cur.referral ? { label: "Remove referral record", act: "ref", id: cur.id } : { label: "Record external or offline referral", act: "ref", id: cur.id, hint: "e.g. social worker, police, family" }], { label: "More for this report" })}</span></div>
        <dl class="kv"><dt>Reporter</dt><dd>${esc(cur.reporter || "Reporter name unavailable")}</dd><dt>Related activity</dt><dd>${esc(cur.related || "No related activity")}</dd><dt>Contact</dt><dd>${cur.contact ? "<b>Contact requested</b> · find them privately at school" : "Not requested"}</dd><dt>Submitted</dt><dd>${S.fmtDate(cur.submitted)}</dd><dt>Review started</dt><dd>${cur.reviewed ? S.fmtDate(cur.reviewed) : "—"}</dd><dt>Closed</dt><dd>${cur.closed ? S.fmtDate(cur.closed) : "—"}</dd></dl>
        ${cur.referral ? `<div class="b-note ok">${IC.out}<div><b>External or offline referral recorded</b><p>Details are kept offline, not in this app.</p></div></div>` : ""}
        <div><p style="font-weight:700;font-size:14px;margin-bottom:8px">Confidential description</p><div class="si-veil ${seen[cur.id] ? "" : "locked"}"><p>${esc(cur.text)}</p>${seen[cur.id] ? `<span class="seen">Opened by you at ${seen[cur.id]}. This view is recorded.</span>` : `<div class="rv"><button type="button" class="btn btn-soft btn-sm" data-reveal="${cur.id}">${IC.eye} View confidential description</button>Opening it is recorded.</div>`}</div></div>
        ${next.length ? `<form class="si-upd" id="siu"><label class="field"><span>Next workflow status</span><select class="input" name="status">${next.map((s) => `<option>${s}</option>`).join("")}</select></label><button class="btn btn-primary">Update status</button></form>` : `<div class="b-note ok">${C.ICON.check}<div><b>Closed on ${S.fmtDate(cur.closed || today())}</b><p>No further steps. The reporter sees it as closed.</p></div></div>`}
      </article></div>` : `<div class="card empty" style="padding:48px"><b style="color:var(--fg)">No safety reports</b><br>${f === "open" ? "Nothing open right now." : "Nothing matches this filter."}</div>`}`);
  S.startClock();
}
document.addEventListener("click", (e) => {
  const s = e.target.closest("[data-sel]"); if (s) { sel = s.dataset.sel; render(); if (innerWidth < 860) document.querySelector(".inbox article").scrollIntoView({ behavior: "smooth" }); }
  const c = e.target.closest("[data-f]"); if (c) { f = c.dataset.f; sel = null; render(); }
  const rv = e.target.closest("[data-reveal]"); if (rv) { seen[rv.dataset.reveal] = new Date().toLocaleTimeString("en-US", { hour: "numeric", minute: "2-digit" }); render(); }
  const rf = e.target.closest('[data-act="ref"]'); if (rf) { const r = reports().find((x) => x.id === rf.dataset.id); r.referral = !r.referral; S.saveLists(); render(); S.toast(r.referral ? "Referral recorded." : "Referral record removed."); }
});
document.addEventListener("submit", (e) => {
  if (e.target.id !== "siu") return; e.preventDefault();
  const r = reports().find((x) => x.id === (sel || document.querySelector(".si-row.sel").dataset.sel)), v = S.formData(e.target).status;
  const go = () => { r.status = v; if (v === "Being reviewed" && !r.reviewed) r.reviewed = today(); if (v === "Closed") { r.closed = today(); if (!r.reviewed) r.reviewed = today(); } S.saveLists(); sel = r.id; if (f !== "all" && !(f === "open" && v !== "Closed")) f = v === "Closed" ? "all" : "open"; render(); S.toast(`Status updated to ${v.toLowerCase()}.`); };
  if (v === "Closed") S.confirm("Close this report?", "The reporter sees it as closed. Make sure any follow-up or referral is done first.", "Close report", go); else go();
});
S.onSearch("q", (v) => { q = v; render(); const el = document.getElementById("q"); el.focus(); el.setSelectionRange(v.length, v.length); });
render();

})();
</script>
</body>
</html>
